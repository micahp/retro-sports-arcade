name: Verify EA evolution exhibit
on:
  push:
    branches: [feat/hockey-arcade-vertical-slice]
    paths: ['reference/evolution.html', 'reference/evolution-manifest.json', 'reference/verify-evolution.cjs', '.github/workflows/verify-evolution.yml']
  workflow_dispatch:
jobs:
  browser-verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Test exhibit and capture screenshots
        run: node reference/verify-evolution.cjs
      - name: Check shareable preview URL
        continue-on-error: true
        run: |
          url="https://raw.githack.com/micahp/retro-sports-arcade/feat/hockey-arcade-vertical-slice/reference/evolution.html"
          status=$(curl --connect-timeout 10 --max-time 30 -sS -L -o /tmp/public-gallery.html -w "%{http_code}" "$url")
          echo "Preview URL $url returned HTTP $status"
          test "$status" = "200"
          grep -q "From" /tmp/public-gallery.html
      - name: Upload desktop/mobile screenshots and source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ea-evolution-browser-evidence
          path: |
            reference/evidence/
            reference/evolution.html
            reference/evolution-manifest.json
          if-no-files-found: warn
